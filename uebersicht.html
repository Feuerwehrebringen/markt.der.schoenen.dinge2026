<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gesamtübersicht – Markt der schönen Dinge 2026</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { padding: 1.5rem; }
    .logo-header { max-width: 260px; width: 100%; height: auto; margin-bottom: 0.5rem; }
    .plan-table { border-collapse: collapse; width: 100%; }
    .plan-table th, .plan-table td {
      border: 1px solid #dbdbdb;
      padding: 6px 10px;
      vertical-align: top;
    }
    .plan-table thead th {
      background: #363636;
      color: #fff;
      text-align: left;
    }
    .rolle-cell { font-weight: 600; white-space: nowrap; background: #fafafa; }
    .frei-cell { color: #b5b5b5; font-style: italic; }
    .toolbar { margin-bottom: 1rem; }

    @media print {
      @page { size: landscape; margin: 1cm; }
      body { padding: 0; }
      .toolbar, .navbar, .no-print { display: none !important; }
      .plan-table { font-size: 11pt; }
    }
  </style>
</head>
<body>

  <div class="toolbar no-print">
    <a href="index.html" class="button is-light">
      <i class="fa-solid fa-arrow-left"></i>&nbsp; Zurück zum Formular
    </a>
    <button class="button is-danger" onclick="window.print()">
      <i class="fa-solid fa-print"></i>&nbsp; Drucken / Als PDF speichern
    </button>
  </div>

  <img class="logo-header" src="logo.png" alt="Freiwillige Feuerwehr Ebringen">
  <h1 class="title is-4">Einteilungsplan – Markt der schönen Dinge 2026</h1>
  <p class="subtitle is-6" id="standInfo">Sonntag, 18.10.2026</p>

  <div id="loading" class="notification is-light">
    <i class="fa-solid fa-spinner fa-spin"></i> Lade Übersicht … das kann bei Google Apps Script gelegentlich ein paar Sekunden dauern.
  </div>

  <div id="loadError" class="notification is-danger" style="display:none;">
    Übersicht konnte nicht geladen werden.
    <button type="button" class="button is-small is-danger is-light ml-2" id="retryBtn">
      <i class="fa-solid fa-rotate-right"></i>&nbsp; Nochmal versuchen
    </button>
  </div>

  <div id="planContainer"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzj9VQteghWUbRZCO9a-iAnACk51peyx65-nNrwV2wg35RGDUTySs8dWVedAKhrhqJJWg/exec';

  ladeUebersicht();
  document.getElementById('retryBtn').addEventListener('click', function () {
    ladeUebersicht(0);
  });

  function ladeUebersicht(versuch) {
    versuch = versuch || 0;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Lade Übersicht … das kann bei Google Apps Script gelegentlich ein paar Sekunden dauern.';
    document.getElementById('loadError').style.display = 'none';
    document.getElementById('planContainer').innerHTML = '';

    const controller = new AbortController();
    const timeoutId = setTimeout(function () { controller.abort(); }, 20000);

    fetch(API_URL, { signal: controller.signal, cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        clearTimeout(timeoutId);
        if (!data.success) throw new Error(data.error || 'Unbekannter Fehler');
        render(data.schichten);
      })
      .catch(function () {
        clearTimeout(timeoutId);
        // Bis zu 2 automatische Wiederholungen im Hintergrund, bevor eine
        // Fehlermeldung erscheint – Cross-Origin-Aufrufe zu Apps Script
        // setzen gelegentlich einzeln aus, klappen aber im nächsten Versuch.
        if (versuch < 2) {
          setTimeout(function () { ladeUebersicht(versuch + 1); }, 1500);
          return;
        }
        document.getElementById('loading').style.display = 'none';
        document.getElementById('loadError').style.display = 'block';
      });
  }

  function render(schichten) {
    document.getElementById('loading').style.display = 'none';

    // Gruppieren nach Block, Reihenfolge der Rollen aus dem ersten Block übernehmen
    const bloecke = {};
    const blockReihenfolge = [];
    schichten.forEach(function (s) {
      if (!bloecke[s.block]) {
        bloecke[s.block] = { start: s.start, ende: s.ende, rollen: {} };
        blockReihenfolge.push(s.block);
      }
      bloecke[s.block].rollen[s.rolle] = s;
    });

    const rollenReihenfolge = [];
    schichten.forEach(function (s) {
      if (rollenReihenfolge.indexOf(s.rolle) === -1) rollenReihenfolge.push(s.rolle);
    });

    if (schichten.length) {
      document.getElementById('standInfo').textContent = schichten[0].datum;
    }

    let html = '<table class="plan-table"><thead><tr><th>Aufgabe</th>';
    blockReihenfolge.forEach(function (block) {
      html += '<th>' + block + '</th>';
    });
    html += '</tr></thead><tbody>';

    rollenReihenfolge.forEach(function (rolle) {
      html += '<tr><td class="rolle-cell">' + rolle + '</td>';
      blockReihenfolge.forEach(function (block) {
        const s = bloecke[block].rollen[rolle];
        if (!s) { html += '<td></td>'; return; }

        if (s.namen && s.namen.length) {
          html += '<td>' + s.namen.join('<br>') +
            (s.frei > 0 ? '<br><span class="frei-cell">+ ' + s.frei + ' frei</span>' : '') +
            '</td>';
        } else {
          html += '<td class="frei-cell">frei (' + s.plaetze + ' Platz' + (s.plaetze > 1 ? 'e' : '') + ')</td>';
        }
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById('planContainer').innerHTML = html;
  }
</script>
</body>
</html>
